name: Publish TypeScript package

on:
  workflow_dispatch:
  push:
    tags:
      - "typescript-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME#typescript-v}" = "$(node -p 'require("./package.json").version')"
      # Keep native SQLite lifecycle coverage deterministic and verify the
      # current Node LTS used by generated TeaQL projects.
      - run: npm test -- --runInBand
      - run: npm run build
      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@latest
      - name: Pack immutable candidate
        id: candidate
        run: |
          candidate_dir="$RUNNER_TEMP/teaql-candidate"
          mkdir -p "$candidate_dir"
          package_name="$(npm pack --ignore-scripts --pack-destination "$candidate_dir" --silent)"
          printf 'path=%s\n' "$candidate_dir/$package_name" >> "$GITHUB_OUTPUT"
          sha256sum "$candidate_dir/$package_name"
      - name: Verify exact candidate reference entries
        env:
          CANDIDATE_PATH: ${{ steps.candidate.outputs.path }}
        run: npm run verify:reference-package -- "$CANDIDATE_PATH"
      - name: Publish verified candidate
        env:
          CANDIDATE_PATH: ${{ steps.candidate.outputs.path }}
        run: npm publish "$CANDIDATE_PATH" --access public --ignore-scripts
